<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MathFit™ Challenge at HXNYC</title>
<meta name="description" content="A free, hands-on family math event for grades K to 5. Sunday, October 18, with Huaxia New York Central Chinese School, Westchester Community College, Valhalla NY.">
<meta property="og:title" content="MathFit™ Challenge at HXNYC · Sunday, October 18">
<meta property="og:description" content="Discover how your child thinks about math. Free for grades K to 5. 50 seats.">
<meta property="og:image" content="https://ananyasingh-png.github.io/mathfit-hxnyc/images/takehome.jpg">
<link rel="icon" href="images/hxnyc-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f1ec; --card: #ffffff; --ink: #15141b; --muted: #5f5c66; --line: #e4ded6; --chip: #efeae3;
    --yellow: #f6c32f; --red: #de3426; --ok: #1f8a4c; --err: #c0392b; --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.05);
    --f: #d23b2e; --u: #1f8a7a; --a: #b7851b; --r: #8a4fbf;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #111016; --card: #1b1a21; --ink: #f3f1ee; --muted: #aaa6b1; --line: #2c2a33; --chip: #25232c; --shadow: none; }
  }
  :root[data-theme="dark"] { --bg: #111016; --card: #1b1a21; --ink: #f3f1ee; --muted: #aaa6b1; --line: #2c2a33; --chip: #25232c; --shadow: none; }
  * { box-sizing: border-box; }
  html, body { overflow-x: hidden; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 Inter, "Noto Sans SC", system-ui, -apple-system, Segoe UI, sans-serif; }
  body.zh { font-family: "Noto Sans SC", Inter, system-ui, sans-serif; }
  a { color: inherit; }
  button { font: inherit; }
  .bar { max-width: 1040px; margin: 0 auto; padding: 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .brand { font-weight: 800; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
  .brand .logo { width: 26px; height: 26px; border-radius: 7px; background: var(--yellow); color: #15141b; display: grid; place-items: center; font-size: 14px; }
  .brand .times { color: var(--muted); font-weight: 500; }
  .brand img { width: 26px; height: 26px; border-radius: 4px; background: #fff; }
  .lang { display: none; gap: 4px; background: var(--chip); padding: 3px; border-radius: 99px; }
  .lang.on { display: flex; }
  .lang button { border: 0; background: transparent; color: var(--muted); font-size: 13px; font-weight: 600; padding: 4px 12px; border-radius: 99px; cursor: pointer; }
  .lang button[aria-pressed="true"] { background: var(--card); color: var(--ink); }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 8px 16px 96px; }
  .top { display: grid; grid-template-columns: 340px 1fr; gap: 40px; align-items: start; }
  .top > * { min-width: 0; }
  @media (max-width: 820px) { .top { grid-template-columns: 1fr; gap: 20px; } .side-only { display: none; } .cover { aspect-ratio: 16 / 10; } }
  @media (min-width: 821px) { .main-only { display: none; } }
  .cover { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 16px; display: block; box-shadow: var(--shadow); }
  .label { font-size: 13px; font-weight: 600; color: var(--muted); padding-bottom: 8px; border-bottom: 1px solid var(--line); margin: 24px 0 12px; }
  .hosts { display: grid; gap: 10px; }
  .host { display: flex; align-items: center; justify-content: space-between; gap: 10px; text-decoration: none; }
  .host .who { display: flex; align-items: center; gap: 10px; font-weight: 600; }
  .av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 13px; color: #15141b; flex: none; }
  .mail { font-size: 13px; color: var(--muted); border: 1px solid var(--line); border-radius: 8px; padding: 3px 9px; }
  .host:hover .mail { color: var(--ink); border-color: var(--ink); }
  .partner { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; margin: 0 0 18px; }
  .partner img { width: 48px; height: 48px; flex: none; border-radius: 6px; background: #fff; }
  .partner small { display: block; font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .02em; }
  .partner b { font-size: 15px; line-height: 1.35; display: block; }
  .presenter { font-size: 14px; color: var(--muted); margin: 0 0 4px; }
  h1 { font-size: clamp(30px, 5vw, 44px); line-height: 1.12; margin: 0 0 20px; letter-spacing: -.02em; }
  .meta { display: grid; gap: 14px; margin-bottom: 22px; }
  .row { display: flex; gap: 14px; align-items: center; }
  .tile { width: 46px; height: 48px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); overflow: hidden; flex: none; text-align: center; }
  .tile .m { font-size: 10px; font-weight: 700; letter-spacing: .06em; background: var(--chip); color: var(--muted); padding: 2px 0; text-transform: uppercase; }
  .tile .d { font-size: 18px; font-weight: 700; line-height: 28px; }
  .pin { width: 46px; height: 48px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; flex: none; font-size: 20px; }
  .row b { display: block; font-weight: 600; }
  .row span { color: var(--muted); font-size: 14px; display: block; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
  .card .hd { padding: 10px 18px; font-size: 13px; font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--line); background: var(--chip); display: flex; justify-content: space-between; gap: 10px; }
  .card .hd .cd { color: var(--ink); }
  .card .bd { padding: 18px; }
  .card p { margin: 0 0 14px; }
  .card p.note { font-size: 13px; color: var(--muted); }
  .meter { margin-bottom: 14px; }
  .meter[hidden] { display: none; }
  .meter .t { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .meter .t span:last-child { color: var(--muted); font-weight: 500; }
  .meter .track { height: 8px; background: var(--chip); border-radius: 99px; overflow: hidden; }
  .meter .fill { height: 100%; width: 0; background: var(--ok); border-radius: 99px; transition: width .6s ease; }
  .btn { display: block; width: 100%; text-align: center; padding: 13px 18px; border-radius: 12px; font-weight: 700; text-decoration: none; border: 0; cursor: pointer; }
  .btn.primary { background: var(--ink); color: var(--bg); }
  .btn.primary[disabled] { opacity: .5; cursor: default; }
  .btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); font-weight: 600; font-size: 14px; padding: 10px; }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  section { margin-top: 40px; }
  h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 14px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  h3 { font-size: 21px; margin: 34px 0 12px; letter-spacing: -.01em; }
  .lead { font-size: 20px; font-weight: 700; margin: 0 0 4px; }
  .body p { margin: 0 0 14px; }
  .img { width: 100%; border-radius: 14px; display: block; margin: 14px 0; }
  ul.take { padding-left: 20px; margin: 0; } ul.take li { margin: 6px 0; }
  .steps { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
  .steps li { display: grid; grid-template-columns: 76px 1fr; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .steps .when { font-weight: 800; font-size: 14px; color: var(--ink); }
  .steps b { display: block; }
  .steps span { color: var(--muted); font-size: 14px; }
  .seg { display: inline-flex; background: var(--chip); padding: 4px; border-radius: 12px; gap: 4px; margin-bottom: 12px; flex-wrap: wrap; }
  .seg button { border: 0; background: transparent; color: var(--muted); font-weight: 700; font-size: 14px; padding: 7px 14px; border-radius: 9px; cursor: pointer; }
  .seg button[aria-selected="true"] { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
  .sample { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media (max-width: 560px) { .sample { grid-template-columns: 1fr; } }
  .sm { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .sm .pill { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
  .sm b { display: block; font-size: 15px; margin: 2px 0 4px; }
  .sm p { margin: 0; font-size: 14px; color: var(--muted); }
  .quiz { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
  .quiz .q { font-size: 18px; font-weight: 700; margin: 4px 0 12px; }
  .quiz .fig { margin: 4px 0 14px; }
  .opts { display: flex; flex-wrap: wrap; gap: 8px; }
  .opts button { border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-weight: 700; padding: 10px 18px; border-radius: 12px; cursor: pointer; min-width: 72px; }
  .opts button.right { border-color: var(--ok); background: rgba(31,138,76,.12); }
  .opts button.wrong { border-color: var(--err); background: rgba(192,57,43,.08); }
  .fb { min-height: 24px; margin-top: 12px; font-size: 15px; }
  .fb.right { color: var(--ok); font-weight: 600; }
  .quiz .nav { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; gap: 10px; flex-wrap: wrap; }
  .quiz .dots { display: flex; gap: 6px; }
  .quiz .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); display: inline-block; }
  .quiz .dots i.on { background: var(--ink); }
  .link { background: none; border: 0; color: var(--ink); font-weight: 700; text-decoration: underline; cursor: pointer; padding: 0; }
  .flips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  @media (max-width: 560px) { .flips { grid-template-columns: repeat(2, 1fr); } }
  .flip { perspective: 800px; height: 128px; border: 0; background: none; padding: 0; cursor: pointer; color: inherit; }
  .flip .in { position: relative; width: 100%; height: 100%; transition: transform .5s; transform-style: preserve-3d; }
  .flip[aria-pressed="true"] .in { transform: rotateY(180deg); }
  .flip .fa, .flip .ba { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 14px; display: grid; place-items: center; text-align: center; padding: 10px; }
  .flip .fa { background: #1c2448; color: #fff; }
  .flip .fa .ic { font-size: 30px; line-height: 1; font-weight: 800; color: var(--yellow); }
  .flip .fa .nm { font-weight: 800; letter-spacing: .06em; font-size: 13px; margin-top: 6px; }
  .flip .ba { background: var(--card); border: 1px solid var(--line); transform: rotateY(180deg); font-size: 14px; color: var(--ink); }
  .flip.gold .fa { background: linear-gradient(135deg, #b8912b, #f3d77a 50%, #b8912b); color: #15141b; }
  .flip.gold .fa .ic { color: #15141b; }
  .hint { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .faq details { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; margin-bottom: 8px; }
  .faq summary { cursor: pointer; font-weight: 600; }
  .faq p { margin: 8px 0 0; color: var(--muted); }
  .older { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--yellow); border-radius: 12px; padding: 16px; }
  .older p { margin: 0 0 8px; } .older a { font-weight: 700; }
  .map { width: 100%; height: 240px; border: 0; border-radius: 14px; margin-top: 12px; background: var(--chip); }
  footer { margin-top: 56px; color: var(--muted); font-size: 14px; }
  .sticky { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); display: none; align-items: center; gap: 12px; z-index: 5; box-shadow: 0 -6px 20px rgba(0,0,0,.08); }
  .sticky .s1 { flex: 1; min-width: 0; font-size: 13px; line-height: 1.3; color: var(--muted); }
  .sticky .s1 b { display: block; font-size: 15px; color: var(--ink); }
  .sticky .btn { width: auto; padding: 11px 18px; }
  @media (max-width: 820px) { .sticky.show { display: flex; } }
  dialog { border: 0; padding: 0; border-radius: 18px; width: min(560px, calc(100vw - 24px)); max-height: calc(100vh - 32px); background: var(--card); color: var(--ink); box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  dialog::backdrop { background: rgba(10,10,14,.55); }
  .dlg-hd { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--card); z-index: 1; }
  .dlg-hd b { font-size: 17px; }
  .dlg-hd .stp { font-size: 12px; color: var(--muted); font-weight: 600; display: block; }
  .x { border: 0; background: var(--chip); color: var(--ink); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 18px; line-height: 1; flex: none; }
  form { padding: 18px 20px 22px; display: grid; gap: 14px; }
  form[hidden] { display: none; }
  .f label, .f legend { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  .f .opt { font-weight: 400; color: var(--muted); }
  .f input[type=text], .f input[type=email], .f input[type=tel], .f select, .f textarea {
    width: 100%; font: inherit; font-size: 16px; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  .f textarea { min-height: 64px; resize: vertical; }
  .f input:focus, .f select:focus, .f textarea:focus { outline: 2px solid var(--yellow); outline-offset: 1px; border-color: transparent; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 480px) { .two, .btns { grid-template-columns: 1fr; } }
  fieldset { border: 0; padding: 0; margin: 0; }
  .choices { display: flex; flex-wrap: wrap; gap: 8px; }
  .choices label { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; font-size: 14px; border: 1px solid var(--line); border-radius: 99px; padding: 6px 12px; margin: 0; cursor: pointer; }
  .check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
  .check input { margin-top: 4px; flex: none; }
  .hp { position: absolute; left: -9999px; }
  .msg { font-size: 14px; border-radius: 10px; padding: 10px 12px; display: none; }
  .msg.err { display: block; background: rgba(192,57,43,.1); color: var(--err); }
  .saved { display: flex; gap: 10px; align-items: center; background: rgba(31,138,76,.1); color: var(--ok); border-radius: 12px; padding: 12px 14px; font-weight: 600; }
  .done { padding: 28px 22px 26px; text-align: center; display: none; }
  .done .big { font-size: 42px; }
  .done h4 { font-size: 22px; margin: 8px 0 6px; }
  .done p { color: var(--muted); margin: 0 0 16px; }
  .toast { position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 10; max-width: calc(100vw - 32px); text-align: center; }
  .toast.on { opacity: 1; }
</style>
</head>
<body>
<div class="bar">
  <div class="brand"><span class="logo">C</span><span>Cuemath Events</span><span class="times">×</span><img src="images/hxnyc-logo.png" alt="HXNYC"></div>
  <div class="lang" id="langSwitch" role="group" aria-label="Language">
    <button type="button" data-lang="en" aria-pressed="true">English</button>
    <button type="button" data-lang="zh" aria-pressed="false">中文</button>
  </div>
</div>

<div class="wrap">
  <div class="top">
    <aside>
      <img class="cover" src="images/takehome.jpg" data-i18n-alt="coverAlt" alt="">
      <div class="side-only">
        <div class="label" data-i18n="hostedBy"></div>
        <div class="hosts" id="hostsSide"></div>
      </div>
    </aside>

    <main>
      <div class="partner">
        <img src="images/hxnyc-logo.png" alt="Huaxia New York Central Chinese School logo">
        <div><small data-i18n="inPartner"></small><b data-i18n="partnerName"></b></div>
      </div>
      <p class="presenter" data-i18n="presented"></p>
      <h1 data-i18n="title"></h1>

      <div class="meta">
        <div class="row">
          <div class="tile"><div class="m" id="tileM"></div><div class="d" id="tileD"></div></div>
          <div><b id="dateText"></b><span id="timeText"></span><span id="timeNote"></span></div>
        </div>
        <div class="row">
          <div class="pin" aria-hidden="true">📍</div>
          <div><b id="venue"></b><span id="address"></span><span data-i18n="during"></span></div>
        </div>
      </div>

      <div class="card" id="regCard">
        <div class="hd"><span data-i18n="registration"></span><span class="cd" id="countdown"></span></div>
        <div class="bd">
          <div class="meter" id="meter" hidden>
            <div class="t"><span id="meterText"></span><span id="meterLeft"></span></div>
            <div class="track"><div class="fill" id="meterFill"></div></div>
          </div>
          <p data-i18n="welcome"></p>
          <button class="btn primary" id="openReg" type="button" data-i18n="registerBtn"></button>
          <div class="btns">
            <a class="btn ghost" id="gcal" href="#" target="_blank" rel="noopener" data-i18n="addCal"></a>
            <button class="btn ghost" id="invite" type="button" data-i18n="invite"></button>
          </div>
          <p class="note" style="margin:12px 0 0" data-i18n="dateNote"></p>
        </div>
      </div>

      <div class="main-only">
        <div class="label" data-i18n="hostedBy"></div>
        <div class="hosts" id="hostsMain"></div>
      </div>

      <section>
        <h2 data-i18n="howTitle"></h2>
        <ol class="steps">
          <li><div class="when" id="tMeet"></div><div><b data-i18n="st1"></b><span data-i18n="st1d"></span></div></li>
          <li><div class="when" id="tStart"></div><div><b data-i18n="st2"></b><span data-i18n="st2d"></span></div></li>
          <li><div class="when" id="tEnd"></div><div><b data-i18n="st3"></b><span data-i18n="st3d"></span></div></li>
          <li><div class="when" data-i18n="afterW"></div><div><b data-i18n="st4"></b><span data-i18n="st4d"></span></div></li>
        </ol>
      </section>

      <section class="body">
        <h2 data-i18n="about"></h2>
        <p class="lead" data-i18n="a1"></p>
        <p data-i18n="a2"></p>
        <p data-i18n-html="a3"></p>
        <p data-i18n="a4"></p>

        <h3 data-i18n="h4"></h3>
        <img class="img" src="images/challenges.png" data-i18n-alt="challengesAlt" alt="">

        <h3 data-i18n="hBand"></h3>
        <p data-i18n="bandIntro"></p>
        <div class="seg" role="tablist" id="bandTabs">
          <button role="tab" type="button" data-band="k1" aria-selected="true">K to 1</button>
          <button role="tab" type="button" data-band="g23" aria-selected="false">2 to 3</button>
          <button role="tab" type="button" data-band="g45" aria-selected="false">4 to 5</button>
        </div>
        <div class="sample" id="bandPanel" role="tabpanel"></div>

        <h3 data-i18n="hTry"></h3>
        <p data-i18n="tryIntro"></p>
        <div class="quiz" id="quiz" aria-live="polite"></div>

        <h3 data-i18n="hReveal"></h3>
        <p data-i18n="reveal"></p>
        <div class="flips" id="flips"></div>
        <p class="hint" data-i18n="flipHint"></p>
        <p style="margin-top:14px" data-i18n="which"></p>

        <h3 data-i18n="hTake"></h3>
        <ul class="take">
          <li data-i18n="t1"></li><li data-i18n="t2"></li><li data-i18n="t3"></li><li data-i18n="t4"></li><li data-i18n="t5"></li>
        </ul>

        <h3 data-i18n="hGood"></h3>
        <ul class="take">
          <li data-i18n="g1"></li><li data-i18n="g2"></li><li data-i18n="g3"></li>
        </ul>

        <h3 data-i18n="hFaq"></h3>
        <div class="faq" id="faq"></div>

        <h3 data-i18n="hOlder"></h3>
        <div class="older">
          <p data-i18n="older"></p>
          <a id="evalLink" href="#" target="_blank" rel="noopener" data-i18n="olderBtn"></a>
        </div>
      </section>

      <section>
        <h2 data-i18n="location"></h2>
        <b id="venue2"></b><div style="color:var(--muted);font-size:14px" id="address2"></div>
        <iframe class="map" id="map" title="Map" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
      </section>

      <footer><span data-i18n="footer"></span> <a href="https://www.cuemath.com" target="_blank" rel="noopener">www.cuemath.com</a></footer>
    </main>
  </div>
</div>

<div class="sticky" id="sticky">
  <div class="s1"><b id="stickyDate"></b><span id="stickySeats"></span></div>
  <button class="btn primary" type="button" id="stickyBtn" data-i18n="registerShort"></button>
</div>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <div class="dlg-hd"><div><span class="stp" id="stepLabel"></span><b id="dlgTitle" data-i18n="formTitle"></b></div><button class="x" type="button" id="closeReg" aria-label="Close">×</button></div>

      ['我需要全程陪同吗？', '请家长在活动开始前 30 分钟与我们见面。学校正在确认其余时间的安排，确定后我们会发邮件通知所有已报名的家庭。'],
      ['会拍照吗？', '只有在您同意的情况下才会拍照，您可以在报名表中选择。'],
      ['如果日期变了怎么办？', '我们会第一时间发邮件告诉所有已报名的家庭新的日期。']
    ],
    hOlder: '👦 家里有六至十二年级的孩子？',
    older: '预约一次免费的 55 分钟一对一数学评估。这是一次真正的交流，不是考试。评估结束后会有一份书面报告，说明孩子目前的水平，以及接下来可以重点关注什么。',
    olderBtn: '预约免费评估',
    location: '地点',
    footer: 'MathFit™ 数学挑战赛由 Cuemath 主办，与华夏纽约中心中文学校合作。',
    coverAlt: '孩子们在 MathFit 挑战赛上展示完成的分数披萨',
    formTitle: '为孩子预留名额', step: (i, n) => '第 ' + i + ' 步，共 ' + n + ' 步',
    fParent: '家长或监护人姓名', fEmail: '电子邮箱', fPhone: '电话', optional: '（选填）',
    fChild: '孩子姓名', fGrade: '孩子年级', choose: '请选择',
    fKids: '几个孩子参加？每个孩子占一个名额。',
    fOthers: '其他孩子的姓名和年级',
    fPrefLang: '活动通知语言',
    fTerms: '我同意', termsLink: '条款与条件',
    fConsent: '我同意 Cuemath 根据隐私政策，为质量、培训、安全、支持和服务改进的目的，对活动进行录制、拍照，以及拍摄我孩子的视频。',
    submit: '预留名额', sending: '正在保存……',
    saved: c => '已为 ' + c + ' 预留名额。',
    step2Intro: '以下三个选填问题可以帮助我们安排活动，也可以跳过。',
    fCurrent: '孩子目前是 Cuemath 学生吗？', yes: '是', no: '否',
    fSource: '您是从哪里得知这次活动的？',
    s1: '孩子的学校或中文学校', s2: '微信群或 WhatsApp 群', s3: '朋友或家人', s4: '教会或社区团体', s5: '社交媒体', s6: '其他',
    fSourceOrg: '是哪所学校或哪个团体告诉您的？（选填）',
    fRep: '我有兴趣成为 Cuemath 代表，参与 Math Fest 推广或现场志愿工作（有偿）',
    skip: '跳过', save2: '完成',
    errRequired: '请填写必填项，并勾选两个同意框。',
    errEmail: '请检查电子邮箱地址。',
    errFull: '抱歉，剩余名额不够这么多孩子。',
    errNet: '报名未能保存，请重试，或发邮件给任意一位主持人。',
    doneTitle: '报名成功！',
    doneText: (c, d) => '已为 ' + c + ' 预留 ' + d + ' 的名额。确认邮件已发送到您的邮箱。邀请其他家庭一起来，孩子在现场就有好朋友了。',
    fruits: ['香蕉', '黄色', '梨', '绿色', '苹果'],
    persona: [
      ['/', 'LINEAR', '一项突出的优势，而且稳定可靠。'],
      ['△', 'GEOMETRIC', '两项优势，相互促进。'],
      ['!', 'EXPONENTIAL', '几乎处处都强，正在起飞。'],
      ['∞', 'INFINITE', '四项全部达到最高。没有上限。金色卡片。'],
      ['◇', 'SYMMETRIC', '四项均衡，全面发展。'],
      ['+', 'POSITIVE', '不断进步，每天都在成长。']
    ]
  }
};

const $ = id => document.getElementById(id);
const qs = new URLSearchParams(location.search);
const ua = navigator.userAgent || '';
const wantsZh = qs.get('lang') === 'zh' || /MicroMessenger/i.test(ua) || (!qs.get('lang') && (navigator.language || '').toLowerCase().startsWith('zh'));
let lang = (EVENT.SHOW_CHINESE && qs.get('lang') !== 'en' && wantsZh) ? 'zh' : 'en';
let seatsLeft = null, taken = null, band = 'k1', qi = 0, regId = '', childName = '';
const tx = k => (T[lang][k] != null ? T[lang][k] : T.en[k]);

const [Y, M, D] = EVENT.date.split('-').map(Number);
const baseDate = new Date(Y, M - 1, D);
const loc = () => lang === 'zh' ? 'zh-CN' : 'en-US';
function dateText() { return baseDate.toLocaleDateString(loc(), { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }); }
function shortDate() { return baseDate.toLocaleDateString(loc(), { weekday: 'short', month: 'short', day: 'numeric' }); }
function hm(str, addMin) { const [h, m] = str.split(':').map(Number); return new Date(2000, 0, 1, h, m + (addMin || 0)); }
function fmt(d) { return d.toLocaleTimeString(loc(), { hour: 'numeric', minute: '2-digit' }); }
function fmt24(d) { return String(d.getHours()).padStart(2, '0') + String(d.getMinutes()).padStart(2, '0') + '00'; }
function timeText() { return EVENT.startTime ? fmt(hm(EVENT.startTime)) + (EVENT.endTime ? (lang === 'zh' ? ' 至 ' : ' to ') + fmt(hm(EVENT.endTime)) : '') + ' ' + EVENT.tzLabel : tx('timeTbc'); }
function daysLeft() { const now = new Date(); const t0 = new Date(now.getFullYear(), now.getMonth(), now.getDate()); return Math.round((baseDate - t0) / 864e5); }

function calLink() {
  const p = n => String(n).padStart(2, '0'), d = '' + Y + p(M) + p(D);
  let dates;
  if (EVENT.startTime) {
    dates = d + 'T' + fmt24(hm(EVENT.startTime, -EVENT.meetMinutesBefore)) + '/' + d + 'T' + fmt24(hm(EVENT.endTime || EVENT.startTime)) + '&ctz=' + encodeURIComponent(EVENT.tz);
  } else { const n = new Date(Y, M - 1, D + 1); dates = d + '/' + n.getFullYear() + p(n.getMonth() + 1) + p(n.getDate()); }
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(T.en.title) + '&dates=' + dates +
    '&details=' + encodeURIComponent('Free, hands-on family math event for grades K to 5. Meet the Cuemath team 30 minutes before the start. Exact time to be confirmed. ' + EVENT.pageUrl) +
    '&location=' + encodeURIComponent(EVENT.venue + ', ' + EVENT.address);
}

function renderHosts(el) {
  el.innerHTML = '';
  EVENT.hosts.forEach(h => {
    const a = document.createElement('a');
    a.className = 'host'; a.href = 'mailto:' + h.email + '?subject=' + encodeURIComponent('MathFit Challenge, October 18');
    const who = document.createElement('span'); who.className = 'who';
    const av = document.createElement('span'); av.className = 'av'; av.style.background = h.color;
    av.textContent = h.name.split(' ').map(w => w[0]).join('').slice(0, 2);
    const nm = document.createElement('span'); nm.textContent = h.name;
    who.append(av, nm);
    const m = document.createElement('span'); m.className = 'mail'; m.textContent = '✉︎ ' + tx('mailWord');
    a.append(who, m); el.append(a);
  });
}

function renderBand() {
  const data = T.en.bands[band], el = $('bandPanel');
  el.innerHTML = '';
  data.forEach(([k, pill, head, body]) => {
    const d = document.createElement('div'); d.className = 'sm';
    const p = document.createElement('div'); p.className = 'pill'; p.style.color = 'var(--' + k + ')'; p.textContent = pill;
    const b = document.createElement('b'); b.textContent = head;
    const t = document.createElement('p'); t.textContent = body;
    d.append(p, b, t); el.append(d);
  });
  document.querySelectorAll('#bandTabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.band === band)));
}

function figure(kind) {
  if (kind === 'grid') {
    let r = '';
    for (let c = 0; c < 3; c++) for (let w = 0; w < 2; w++) r += '<rect x="' + (4 + c * 64) + '" y="' + (4 + w * 64) + '" width="64" height="64" fill="none" stroke="currentColor" stroke-width="3"/>';
    return '<svg class="fig" width="200" height="136" viewBox="0 0 200 136" role="img" aria-label="A grid 3 squares wide and 2 squares tall">' + r + '</svg>';
  }
  if (kind === 'pattern') {
    const f = tx('fruits');
    return '<div class="fig" style="display:grid;grid-template-columns:auto auto auto;gap:6px 12px;align-items:center;font-size:18px;font-weight:600;width:max-content">' +
      '<span>🍌 ' + f[0] + '</span><span>→</span><span style="color:#b7851b">' + f[1] + '</span>' +
      '<span>🍐 ' + f[2] + '</span><span>→</span><span style="color:#1f8a4c">' + f[3] + '</span>' +
      '<span>🍎 ' + f[4] + '</span><span>→</span><span>?</span></div>';
  }
  return '';
}

function renderQuiz() {
  const Q = T.en.quiz, el = $('quiz');
  el.innerHTML = '';
  if (qi >= Q.length) {
    const p = document.createElement('p'); p.className = 'q'; p.textContent = tx('quizEnd');
    const r = document.createElement('div'); r.className = 'nav';
    const b = document.createElement('button'); b.className = 'btn primary'; b.type = 'button'; b.textContent = tx('quizCta'); b.style.maxWidth = '260px';
    b.addEventListener('click', openReg);
    const again = document.createElement('button'); again.className = 'link'; again.type = 'button'; again.textContent = tx('again');
    again.addEventListener('click', () => { qi = 0; renderQuiz(); });
    r.append(b, again); el.append(p, r); return;
  }
  const q = Q[qi];
  const head = document.createElement('div'); head.style.cssText = 'font-size:12px;font-weight:700;color:var(--r)'; head.textContent = tx('qOf')(qi + 1, Q.length) + ' · ' + q.band;
  const qq = document.createElement('div'); qq.className = 'q'; qq.textContent = q.q;
  const fig = document.createElement('div'); fig.innerHTML = figure(q.fig);
  const opts = document.createElement('div'); opts.className = 'opts';
  const fb = document.createElement('div'); fb.className = 'fb';
  const nav = document.createElement('div'); nav.className = 'nav';
  const dots = document.createElement('div'); dots.className = 'dots';
  Q.forEach((_, i) => { const d = document.createElement('i'); if (i <= qi) d.className = 'on'; dots.append(d); });
  nav.append(dots);
  q.opts.forEach((o, i) => {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = o;
    b.addEventListener('click', () => {
      if (i === q.a) {
        b.classList.add('right'); fb.className = 'fb right'; fb.textContent = tx('correct') + q.why;
        opts.querySelectorAll('button').forEach(x => { x.disabled = true; });
        if (!nav.querySelector('.link')) { const n = document.createElement('button'); n.className = 'link'; n.type = 'button'; n.textContent = tx('next'); n.addEventListener('click', () => { qi++; renderQuiz(); }); nav.append(n); }
      } else { b.classList.add('wrong'); fb.className = 'fb'; fb.textContent = tx('tryAgain'); }
    });
    opts.append(b);
  });
  el.append(head, qq, fig, opts, fb, nav);
}

function renderFlips() {
  const el = $('flips'); el.innerHTML = '';
  tx('persona').forEach(([ic, nm, line]) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'flip' + (nm === 'INFINITE' ? ' gold' : ''); b.setAttribute('aria-pressed', 'false');
    b.setAttribute('aria-label', nm + ': ' + line);
    const inn = document.createElement('div'); inn.className = 'in';
    const fa = document.createElement('div'); fa.className = 'fa';
    const w = document.createElement('div');
    const i1 = document.createElement('div'); i1.className = 'ic'; i1.textContent = ic;
    const n1 = document.createElement('div'); n1.className = 'nm'; n1.textContent = nm;
    w.append(i1, n1); fa.append(w);
    const ba = document.createElement('div'); ba.className = 'ba'; ba.textContent = line;
    inn.append(fa, ba); b.append(inn);
    b.addEventListener('click', () => b.setAttribute('aria-pressed', String(b.getAttribute('aria-pressed') !== 'true')));
    el.append(b);
  });
}

function renderFaq() {
  const el = $('faq'); el.innerHTML = '';
  tx('faq').forEach(([q, a]) => {
    const d = document.createElement('details'); const s = document.createElement('summary'); s.textContent = q;
    const p = document.createElement('p'); p.textContent = a; d.append(s, p); el.append(d);
  });
}

function renderTimes() {
  if (!EVENT.startTime) return;
  $('tMeet').textContent = fmt(hm(EVENT.startTime, -EVENT.meetMinutesBefore));
  $('tStart').textContent = fmt(hm(EVENT.startTime));
  $('tEnd').textContent = fmt(hm(EVENT.endTime || EVENT.startTime));
}

function render() {
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  document.body.classList.toggle('zh', lang === 'zh');
  document.title = tx('title');
  document.querySelectorAll('[data-i18n]').forEach(n => { const v = tx(n.dataset.i18n); if (typeof v === 'string') n.textContent = v; });
  document.querySelectorAll('[data-i18n-html]').forEach(n => { n.innerHTML = tx(n.dataset.i18nHtml); });
  document.querySelectorAll('[data-i18n-alt]').forEach(n => { n.alt = tx(n.dataset.i18nAlt); });
  $('tileM').textContent = baseDate.toLocaleDateString('en-US', { month: 'short' });
  $('tileD').textContent = D;
  $('dateText').textContent = dateText();
  $('timeText').textContent = timeText();
  $('timeNote').textContent = EVENT.timeNote ? tx('timeNoteTxt') : '';
  $('venue').textContent = $('venue2').textContent = EVENT.venue;
  $('address').textContent = $('address2').textContent = EVENT.address;
  $('evalLink').href = EVENT.evalLink;
  $('gcal').href = $('gcal2').href = calLink();
  $('countdown').textContent = tx('countdown')(daysLeft());
  $('stickyDate').textContent = shortDate() + ' · HXNYC';
  renderHosts($('hostsSide')); renderHosts($('hostsMain'));
  renderTimes(); renderBand(); renderQuiz(); renderFlips(); renderFaq();
  document.querySelectorAll('#langSwitch button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  renderSeats();
}

function renderSeats() {
  const btns = [$('openReg'), $('stickyBtn')];
  $('stickySeats').textContent = tx('stickySeats')(seatsLeft);
  if (!EVENT.REGISTER_URL) {
    btns.forEach(b => { b.disabled = true; }); $('openReg').textContent = tx('soon'); $('stickyBtn').textContent = tx('soon'); $('meter').hidden = true; return;
  }
  btns.forEach(b => { b.disabled = false; }); $('openReg').textContent = tx('registerBtn'); $('stickyBtn').textContent = tx('registerShort');
  if (seatsLeft === null) return;
  $('meter').hidden = false;
  $('meterText').textContent = tx('seatsTaken')(taken, EVENT.capacity);
  $('meterLeft').textContent = tx('seatsLeft')(seatsLeft);
  $('meterFill').style.width = Math.min(100, Math.round(taken / EVENT.capacity * 100)) + '%';
  if (seatsLeft <= 0) { btns.forEach(b => { b.disabled = true; }); $('openReg').textContent = tx('full'); $('stickyBtn').textContent = tx('full'); }
}

async function loadSeats() {
  if (!EVENT.REGISTER_URL) return;
  try {
    const r = await fetch(EVENT.REGISTER_URL, { method: 'GET' });
    const j = await r.json();
    if (j && j.ok) { seatsLeft = j.left; taken = j.taken; renderSeats(); }
  } catch (e) { /* the meter stays hidden; registration still works */ }
}

if (EVENT.SHOW_CHINESE) {
  $('langSwitch').classList.add('on');
  document.querySelectorAll('#langSwitch button').forEach(b => b.addEventListener('click', () => {
    lang = b.dataset.lang; const u = new URL(location.href); u.searchParams.set('lang', lang); history.replaceState(null, '', u); render();
  }));
}
document.querySelectorAll('#bandTabs button').forEach(b => b.addEventListener('click', () => { band = b.dataset.band; renderBand(); }));

const sticky = $('sticky');
if ('IntersectionObserver' in window) {
  new IntersectionObserver(es => es.forEach(e => sticky.classList.toggle('show', !e.isIntersecting && e.boundingClientRect.top < 0))).observe($('regCard'));
}

async function invite() {
  const url = EVENT.pageUrl + '?utm_source=invite&utm_medium=share&utm_campaign=hxnyc-mathfit' + (lang === 'zh' ? '&lang=zh' : '');
  const text = tx('inviteMsg')(url);
  try {
    if (navigator.share && /Mobi|Android|iPhone/i.test(ua)) { await navigator.share({ title: tx('title'), text: text }); return; }
    await navigator.clipboard.writeText(text);
    toast(tx('copied'));
  } catch (err) {}
}
function toast(msg) { const x = $('toast'); x.textContent = msg; x.classList.add('on'); setTimeout(() => x.classList.remove('on'), 2600); }
$('invite').addEventListener('click', invite); $('invite2').addEventListener('click', invite);

const dlg = $('dlg');
function openReg() {
  if (!EVENT.REGISTER_URL || (seatsLeft !== null && seatsLeft <= 0)) { $('regCard').scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
  $('step1').hidden = false; $('step2').hidden = true; $('done').style.display = 'none';
  $('stepLabel').textContent = tx('step')(1, 2);
  if (typeof dlg.showModal === 'function') dlg.showModal(); else dlg.setAttribute('open', '');
  setTimeout(() => $('parentName').focus(), 50);
}
$('openReg').addEventListener('click', openReg); $('stickyBtn').addEventListener('click', openReg);
$('closeReg').addEventListener('click', () => dlg.close());
$('kids').addEventListener('change', e => { $('othersWrap').hidden = e.target.value === '1'; });
function showErr(msg) { const m = $('msg1'); m.textContent = msg; m.className = 'msg err'; m.scrollIntoView({ block: 'nearest' }); }

async function post(data) {
  try {
    const r = await fetch(EVENT.REGISTER_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(data) });
    return await r.json();
  } catch (err) {
    try { await fetch(EVENT.REGISTER_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(data) }); return { ok: true, blind: true }; }
    catch (e2) { return { ok: false, error: 'net' }; }
  }
}

$('step1').addEventListener('submit', async e => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData($('step1')).entries());
  data.terms = $('terms').checked; data.consent = $('consent').checked; data.pageLang = lang;
  data.utm = [qs.get('utm_source'), qs.get('utm_medium'), qs.get('utm_campaign')].filter(Boolean).join(' / ');
  if (['parentName', 'email', 'childName', 'grade', 'kids'].some(k => !String(data[k] || '').trim()) || !data.terms || !data.consent) return showErr(tx('errRequired'));
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email)) return showErr(tx('errEmail'));
  regId = regId || (Date.now().toString(36) + Math.random().toString(36).slice(2, 8));
  data.regId = regId;
  const btn = $('submit1'); btn.disabled = true; btn.textContent = tx('sending'); $('msg1').className = 'msg';
  const j = await post(data);
  btn.disabled = false; btn.textContent = tx('submit');
  if (!j.ok) return showErr(j.error === 'full' ? tx('errFull') : tx('errNet'));
  if (typeof j.left === 'number') { seatsLeft = j.left; taken = EVENT.capacity - j.left; }
  childName = data.childName; renderSeats();
  $('step1').hidden = true; $('step2').hidden = false; $('stepLabel').textContent = tx('step')(2, 2);
  $('savedText').textContent = tx('saved')(childName);
});

function finish() {
  $('step2').hidden = true; $('done').style.display = 'block'; $('stepLabel').textContent = '';
  $('doneText').textContent = tx('doneText')(childName, dateText());
}
$('skip2').addEventListener('click', finish);
$('step2').addEventListener('submit', async e => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData($('step2')).entries());
  data.action = 'update'; data.regId = regId;
  $('submit2').disabled = true;
  await post(data);
  $('submit2').disabled = false; finish();
});

$('map').src = 'https://www.google.com/maps?q=' + encodeURIComponent(EVENT.venue + ', ' + EVENT.address) + '&output=embed';
render();
loadSeats();
</script>
</body>
</html>
