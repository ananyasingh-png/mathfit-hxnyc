  .lang { display: none; gap: 4px; background: var(--chip); padding: 3px; border-radius: 99px; }

  .lead { font-size: 20px; font-weight: 700; margin: 0 0 4px; }

  footer { margin-top: 56px; color: var(--muted); font-size: 14px; }

  .dlg-hd { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--card); z-index: 1; }

  form { padding: 18px 20px 22px; display: grid; gap: 14px; }
  .f label, .f legend { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  .f .opt { font-weight: 400; color: var(--muted); }
  .f input[type=text], .f input[type=email], .f input[type=tel], .f select, .f textarea {

  .choices { display: flex; flex-wrap: wrap; gap: 8px; }

  .check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
  .check input { margin-top: 4px; flex: none; }
  .hp { position: absolute; left: -9999px; }
  .msg { font-size: 14px; border-radius: 10px; padding: 10px 12px; display: none; }
  .msg.err { display: block; background: rgba(192,57,43,.1); color: var(--err); }
  .done { padding: 28px 22px 26px; text-align: center; display: none; }
  .done .big { font-size: 42px; }
  .done h4 { font-size: 22px; margin: 8px 0 6px; }
  .done p { color: var(--muted); margin: 0 0 16px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 10; }
  .toast.on { opacity: 1; }
</style>
</head>

const $ = id => document.getElementById(id);
const qs = new URLSearchParams(location.search);
let lang = (EVENT.SHOW_CHINESE && (qs.get('lang') === 'zh' || (!qs.get('lang') && (navigator.language || '').toLowerCase().startsWith('zh')))) ? 'zh' : 'en';
let seatsLeft = null, taken = null;

const [Y, M, D] = EVENT.date.split('-').map(Number);
const baseDate = new Date(Y, M - 1, D);
function dateText() { return baseDate.toLocaleDateString(lang === 'zh' ? 'zh-CN' : 'en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }); }
function fmtTime(hm) { const [h, m] = hm.split(':').map(Number); return new Date(2000, 0, 1, h, m).toLocaleTimeString(lang === 'zh' ? 'zh-CN' : 'en-US', { hour: 'numeric', minute: '2-digit' }); }
function timeText() { return EVENT.startTime ? fmtTime(EVENT.startTime) + (EVENT.endTime ? (lang === 'zh' ? ' 至 ' : ' to ') + fmtTime(EVENT.endTime) : '') + ' ' + EVENT.tzLabel : T[lang].timeTbc; }

function calLink() {
  const p = n => String(n).padStart(2, '0');
  const d = '' + Y + p(M) + p(D);
  let dates;
  if (EVENT.startTime) {
    const s = EVENT.startTime.replace(':', '') + '00', e = (EVENT.endTime || EVENT.startTime).replace(':', '') + '00';
    dates = d + 'T' + s + '/' + d + 'T' + e + '&ctz=' + encodeURIComponent(EVENT.tz);
  } else {
    const n = new Date(Y, M - 1, D + 1); dates = d + '/' + n.getFullYear() + p(n.getMonth() + 1) + p(n.getDate());
  }
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(T.en.title) + '&dates=' + dates +
    '&details=' + encodeURIComponent('Free, hands-on family math event for grades K to 5. About 90 minutes. One parent or guardian stays. Bring a phone to scan the Compass QR. ' + location.href.split('?')[0]) +
    '&location=' + encodeURIComponent(EVENT.venue + ', ' + EVENT.address);
}

function renderHosts(el) {
  el.innerHTML = '';
  EVENT.hosts.forEach(h => {
    const a = document.createElement('a');
    a.className = 'host'; a.href = 'mailto:' + h.email + '?subject=' + encodeURIComponent('MathFit Challenge, October 4');
    const who = document.createElement('span'); who.className = 'who';
    const av = document.createElement('span'); av.className = 'av'; av.style.background = h.color;
    av.textContent = h.name.split(' ').map(w => w[0]).join('').slice(0, 2);
    const nm = document.createElement('span'); nm.textContent = h.name;
    who.append(av, nm);
    const m = document.createElement('span'); m.className = 'mail'; m.textContent = '✉︎ ' + (lang === 'zh' ? '邮件' : 'Email');
    a.append(who, m); el.append(a);
  });
}

function render() {
  const t = T[lang];
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  document.body.classList.toggle('zh', lang === 'zh');
  document.title = t.title;
  document.querySelectorAll('[data-i18n]').forEach(n => { const v = t[n.dataset.i18n]; if (typeof v === 'string') n.textContent = v; });
  document.querySelectorAll('[data-i18n-html]').forEach(n => { n.innerHTML = t[n.dataset.i18nHtml]; });
  document.querySelectorAll('[data-i18n-alt]').forEach(n => { n.alt = t[n.dataset.i18nAlt]; });
  $('tileM').textContent = baseDate.toLocaleDateString('en-US', { month: 'short' });
  $('tileD').textContent = D;
  $('dateText').textContent = dateText();
  $('timeText').textContent = timeText();
  $('venue').textContent = $('venue2').textContent = EVENT.venue;
  $('address').textContent = $('address2').textContent = EVENT.address;
  $('evalLink').href = EVENT.evalLink;
  $('gcal').href = $('gcal2').href = calLink();
  renderHosts($('hostsSide')); renderHosts($('hostsMain'));
  document.querySelectorAll('#langSwitch button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  renderSeats();
}

function renderSeats() {
  const t = T[lang], btn = $('openReg');
  if (!EVENT.REGISTER_URL) { btn.disabled = true; btn.textContent = t.soon; $('seats').hidden = true; return; }
  btn.disabled = false; btn.textContent = t.registerBtn;
  if (seatsLeft === null) return;
  $('seats').hidden = false; $('seatsText').textContent = t.seatsLeft(seatsLeft, EVENT.capacity);
  $('goingSide').textContent = $('goingMain').textContent = taken ? t.going(taken) : '';
  if (seatsLeft <= 0) { btn.disabled = true; btn.textContent = t.full; }
}

async function loadSeats() {
  if (!EVENT.REGISTER_URL) return;
  try {
    const r = await fetch(EVENT.REGISTER_URL, { method: 'GET' });
    const j = await r.json();
    if (j && j.ok) { seatsLeft = j.left; taken = j.families; renderSeats(); }
  } catch (e) { /* seat count stays hidden; registration still works */ }
}

if (EVENT.SHOW_CHINESE) {
  $('langSwitch').classList.add('on');
  document.querySelectorAll('#langSwitch button').forEach(b => b.addEventListener('click', () => {
    lang = b.dataset.lang; const u = new URL(location.href); u.searchParams.set('lang', lang); history.replaceState(null, '', u); render();
  }));
}

const dlg = $('dlg'), form = $('regForm');
$('openReg').addEventListener('click', () => { if (typeof dlg.showModal === 'function') dlg.showModal(); else dlg.setAttribute('open', ''); $('parentName').focus(); });
$('closeReg').addEventListener('click', () => dlg.close());
$('closeDone').addEventListener('click', () => dlg.close());
$('kids').addEventListener('change', e => { $('othersWrap').hidden = e.target.value === '1'; });

function showErr(msg) { const m = $('formMsg'); m.textContent = msg; m.className = 'msg err'; m.scrollIntoView({ block: 'nearest' }); }

form.addEventListener('submit', async e => {
  e.preventDefault();
  const t = T[lang], fd = new FormData(form);
  const data = Object.fromEntries(fd.entries());
  data.terms = $('terms').checked; data.consent = $('consent').checked;
  data.pageLang = lang;
  data.utm = [qs.get('utm_source'), qs.get('utm_medium'), qs.get('utm_campaign')].filter(Boolean).join(' / ');
  const req = ['parentName', 'email', 'childName', 'grade', 'kids', 'source', 'rep'];
  if (req.some(k => !String(data[k] || '').trim()) || !data.terms || !data.consent) return showErr(t.errRequired);
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email)) return showErr(t.errEmail);
  const btn = $('submitBtn'); btn.disabled = true; btn.textContent = t.sending; $('formMsg').className = 'msg';
  let ok = false, full = false;
  try {
    const r = await fetch(EVENT.REGISTER_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(data) });
    const j = await r.json();
    ok = !!j.ok; full = j.error === 'full';
    if (ok && typeof j.left === 'number') { seatsLeft = j.left; taken = (taken || 0) + 1; }
  } catch (err) {
    try { await fetch(EVENT.REGISTER_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(data) }); ok = true; } catch (e2) { ok = false; }
  }
  btn.disabled = false; btn.textContent = t.submit;
  if (!ok) return showErr(full ? t.errFull : t.errNet);
  form.style.display = 'none'; $('done').style.display = 'block';
  $('doneText').textContent = t.doneText(data.childName, dateText());
  renderSeats();
});

$('share').addEventListener('click', async () => {
  const t = T[lang], url = location.href.split('#')[0];
  const data = { title: t.title, text: t.a2 + ' ' + dateText() + ', ' + EVENT.venue + '.', url };
  try {
    if (navigator.share) { await navigator.share(data); return; }
    await navigator.clipboard.writeText(data.text + ' ' + url);
    const x = $('toast'); x.textContent = t.copied; x.classList.add('on'); setTimeout(() => x.classList.remove('on'), 1800);
  } catch (err) {}
});

$('map').src = 'https://www.google.com/maps?q=' + encodeURIComponent(EVENT.venue + ', ' + EVENT.address) + '&output=embed';
render();
loadSeats();
</script>
</body>
</html>
